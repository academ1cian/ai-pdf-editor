name: Diagnose public deployment readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-public.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read only public status and version metadata
        run: |
          node --input-type=module <<'JS'
          const endpoints = [
            ['production-config', 'https://ai-pdf-editor.pages.dev/api/config'],
            ['production-version', 'https://ai-pdf-editor.pages.dev/version.json'],
            ['queried-version', 'https://ai-pdf-editor.pages.dev/version.json?deployment=4ba1d0c88505b5687144addbb87d16cc6921ce42'],
            ['uploaded-version', 'https://6c396c0b.ai-pdf-editor.pages.dev/version.json'],
          ];
          for (const [name,url] of endpoints) {
            try {
              const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
              let data={};
              try {data=await response.json();} catch {}
              console.log(JSON.stringify({
                name,status:response.status,type:response.headers.get('content-type'),
                cache:response.headers.get('cache-control'),
                enabled:typeof data.enabled==='boolean'?data.enabled:undefined,
                commit:typeof data.commit==='string'&&/^[a-f0-9]{40}$/.test(data.commit)?data.commit:undefined,
              }));
            } catch {console.log(JSON.stringify({name,error:'Public endpoint could not be reached'}));}
          }
          JS
